services:
  web:
    build:
      context: .
      target: serve
    image: night-rail-scheduler-web
    ports:
      # 宿主机端口可用环境变量 WEB_PORT 覆盖，默认 8080；容器内固定监听 8080
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  verify:
    # 一次性验收服务：构建并运行类型检查、生产构建与 Vitest（含小规模穷举核对）
    # 使用方式：docker compose build verify && docker compose up --build verify
    build:
      context: .
      target: verify
    image: night-rail-scheduler-verify
    restart: "no"
